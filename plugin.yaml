name: env-brief
version: 1.0.0
description: "Hermes plugin: system-level host facts injected into each session's system prompt (frozen at first build; re-rendered verbatim at compact; byte-stable, prefix-cache friendly) + on-demand env_time tool. Auto-probes the machine (host/os/arch/cpu/memory/disk/user/timezone/root/sudo) on session start, with a single SHARED data file (~/.hermes/env-brief.yaml, absolute path, NOT per-profile) that every profile under a multiplexed gateway reads the same bytes from. Data: /root/.hermes/env-brief.yaml."
enabled: true
provides_hooks:
  - on_session_start
