name: env-brief
version: 1.1.0
description: "Hermes plugin: system-level host facts injected into each session's system prompt (frozen at first build; re-rendered verbatim at compact; byte-stable, prefix-cache friendly) + on-demand env_time tool. Auto-probes the machine (host/os/arch/cpu/memory/disk/user/timezone/admin) on session start on Windows/macOS/Linux, with a single SHARED data file that every profile under a multiplexed gateway reads the same bytes from. Data path: walk-up from $HERMES_HOME to the shared HERMES root (the dir holding profiles/ or env-brief.yaml); fallback ~/.hermes, and %APPDATA%/hermes on Windows."
enabled: true
provides_hooks:
  - on_session_start
